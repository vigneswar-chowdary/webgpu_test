<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanchenjunga Sunset - WebGPU</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4a4a;
            font-family: sans-serif;
            font-size: 1.2rem;
            text-align: center;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="error-message">WebGPU is not supported or enabled in your browser.</div>
    <canvas id="webgpu-canvas"></canvas>

    <script type="module">
        // --- WGSL Shaders ---
        const shaderCode = `
        struct VertexOutput {
            @builtin(position) position: vec4f,
            @location(0) uv: vec2f,
        };

        @vertex
        fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
            var pos = array<vec2f, 4>(
                vec2f(-1.0, -1.0),
                vec2f( 1.0, -1.0),
                vec2f(-1.0,  1.0),
                vec2f( 1.0,  1.0)
            );
            var uvs = array<vec2f, 4>(
                vec2f(0.0, 1.0),
                vec2f(1.0, 1.0),
                vec2f(0.0, 0.0),
                vec2f(1.0, 0.0)
            );

            var out: VertexOutput;
            out.position = vec4f(pos[vertexIndex], 0.0, 1.0);
            out.uv = uvs[vertexIndex];
            return out;
        }

        // Fractional Brownian Motion for procedural terrain generation
        fn hash(p: vec2f) -> f32 {
            var p3 = fract(vec3f(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
        }

        fn noise(p: vec2f) -> f32 {
            let i = floor(p);
            let f = fract(p);
            let u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i + vec2f(0.0,0.0)), hash(i + vec2f(1.0,0.0)), u.x),
                       mix(hash(i + vec2f(0.0,1.0)), hash(i + vec2f(1.0,1.0)), u.x), u.y);
        }

        fn fbm(p: vec2f) -> f32 {
            var v = 0.0;
            var a = 0.5;
            var shift = vec2f(100.0);
            var m = mat2x2f(1.6,  1.2, -1.2,  1.6);
            var coord = p;
            for (var i = 0; i < 5; i++) {
                v += a * noise(coord);
                coord = m * coord + shift;
                a *= 0.5;
            }
            return v;
        }

        @fragment
        fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
            // 1. Sky Gradient (Deep Indigo to soft Purple-Pink near the horizon)
            let skyTop = vec3f(0.22, 0.29, 0.58);
            let skyBottom = vec3f(0.42, 0.35, 0.59);
            var finalColor = mix(skyTop, skyBottom, uv.y);

            // 2. The Clouds / Sunset Glow behind the ridge
            let cloudNoise = fbm(uv * vec2f(3.0, 5.0) + vec2f(0.0, -0.1));
            let glowColor = vec3f(0.98, 0.45, 0.41); // Vibrant pink/orange
            let glowMask = smoothstep(0.3, 0.8, cloudNoise) * smoothstep(0.3, 0.7, 1.0 - uv.y);
            finalColor = mix(finalColor, glowColor, glowMask * 0.65);

            // 3. Shape of Kanchenjunga (Procedural math mimicking the sharp, steep pyramid peak)
            let xOffset = uv.x - 0.46; // Center the peak slightly to the left
            
            // Base pyramid structure
            var mountainShape = 0.72 - 1.2 * abs(xOffset); 
            
            // Add right shoulder ridge drop
            if (xOffset > 0.05) {
                mountainShape -= (xOffset - 0.05) * 0.5;
            }
            
            // Distort shape using FBM noise to make it rugged and organic
            let ruggedness = fbm(uv * vec2f(8.0, 4.0)) * 0.12;
            let microRuggedness = fbm(uv * vec2f(45.0, 20.0)) * 0.015;
            mountainShape += ruggedness + microRuggedness;

            // 4. Render Mountain Layer
            if (uv.y > (1.0 - mountainShape)) {
                // Base mountain rock color (shadowed violet-blue)
                let mountainBaseColor = vec3f(0.35, 0.31, 0.48);
                
                // Snow distribution based on steepness and high-frequency noise
                let snowNoise = fbm(uv * vec2f(35.0, 35.0));
                let isSnow = smoothstep(0.35, 0.6, snowNoise);
                
                // Directional lighting mimicking the right-side sunset glow
                // Slopes facing right get the bright sunset illumination
                let slopeX = dpdx(mountainShape); 
                let lightingDirection = smoothstep(-0.005, 0.015, xOffset + snowNoise * 0.05);
                
                let snowShadow = vec3f(0.72, 0.70, 0.85); // Left-side shaded snow
                let snowLit = vec3f(0.98, 0.71, 0.64);    // Right-side sun-kissed snow (glowing pink)
                
                let snowFinalColor = mix(snowShadow, snowLit, lightingDirection);
                var mountainSurface = mix(mountainBaseColor, snowFinalColor, isSnow * 0.85);
                
                // Extra intense Alpenglow bloom on the extreme upper-right peak facets
                if (xOffset > -0.1 && uv.y < 0.65) {
                    let peakGlow = smoothstep(-0.05, 0.2, xOffset) * (1.0 - smoothstep(0.4, 0.65, uv.y));
                    mountainSurface = mix(mountainSurface, vec3f(0.99, 0.52, 0.45), peakGlow * 0.4);
                }

                finalColor = mountainSurface;
            }

            // 5. Foreground Treeline Silhouette (Dark pine shapes)
            let treeLayer = 0.24 + fbm(vec2f(uv.x * 25.0, 0.0)) * 0.05 + sin(uv.x * 12.0) * 0.03;
            if (uv.y > (1.0 - treeLayer)) {
                finalColor = vec3f(0.01, 0.02, 0.05); // Almost pure black silhouette
            }

            return vec4f(finalColor, 1.0);
        }
        `;

        // --- WebGPU Initialization Boilerplate ---
        async function init() {
            if (!navigator.gpu) {
                document.getElementById('error-message').style.display = 'block';
                return;
            }

            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                document.getElementById('error-message').style.display = 'block';
                return;
            }
            const device = await adapter.requestDevice();

            const canvas = document.getElementById('webgpu-canvas');
            const context = canvas.getContext('webgpu');

            // Handle high-DPI displays safely
            const devicePixelRatio = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * devicePixelRatio;
            canvas.height = window.innerHeight * devicePixelRatio;

            const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
            context.configure({
                device,
                format: presentationFormat,
                alphaMode: 'premultiplied',
            });

            const shaderModule = device.createShaderModule({
                code: shaderCode,
            });

            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vs_main',
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fs_main',
                    targets: [{
                        format: presentationFormat,
                    }],
                },
                primitive: {
                    topology: 'triangle-strip',
                },
            });

            function render() {
                const commandEncoder = device.createCommandEncoder();
                const textureView = context.getCurrentTexture().createView();

                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store',
                    }],
                };

                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.setPipeline(pipeline);
                passEncoder.draw(4); // Draw full-screen quad (via 4 vertex indices)
                passEncoder.end();

                device.queue.submit([commandEncoder.finish()]);
            }

            // Render static landscape image
            render();

            // Adjust sizing seamlessly on window resize
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth * devicePixelRatio;
                canvas.height = window.innerHeight * devicePixelRatio;
                render();
            });
        }

        init();
    </script>
</body>
</html>
