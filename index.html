<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebGPU Mount Fuji</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #0b132b; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <canvas id="fujiCanvas"></canvas>

    <script type="module">
        // 1. Shading Language (WGSL) - Draws the exact shapes procedurally
        const shaderSource = `
            struct Uniforms {
                res: vec2<f32>,
            }
            @group(0) @binding(0) var<uniform> uniforms: Uniforms;

            struct VertexOutput {
                @builtin(position) pos: vec4<f32>,
                @location(0) uv: vec2<f32>
            }

            @vertex
            fn vs_main(@builtin(vertex_index) idx: u32) -> VertexOutput {
                // Generates a full-screen triangle procedurally without vertex arrays
                var pos = array<vec2<f32>, 3>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 3.0, -1.0),
                    vec2<f32>(-1.0,  3.0)
                );
                var out: VertexOutput;
                out.pos = vec4<f32>(pos[idx], 0.0, 1.0);
                out.uv = pos[idx] * 0.5 + 0.5;
                return out;
            }

            @fragment
            fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
                let uv = in.uv;
                // Correct coordinate system for aspect ratios
                let aspectUV = (uv * 2.0 - 1.0) * vec2<f32>(uniforms.res.x / uniforms.res.y, 1.0);

                // Sky color background
                let skyColor = vec4<f32>(0.15, 0.25, 0.45, 1.0);

                // Mathematical curve generating the volcano slopes
                let fujiX = aspectUV.x;
                let slope = 0.58 * exp(-2.8 * abs(fujiX)) + 0.12 * exp(-0.3 * abs(fujiX));
                let fujiHeight = slope - 0.45;

                // If the current pixel is beneath the mountain's height curve
                if (aspectUV.y < fujiHeight) {
                    let fujiSkyBlue = vec4<f32>(0.32, 0.58, 0.82, 1.0); // Mountain base
                    let snowWhite = vec4<f32>(0.96, 0.98, 1.0, 1.0);     // Snowcap top

                    // Cutoff threshold line for the cartoon snowcap
                    if (aspectUV.y > fujiHeight - 0.09 && aspectUV.y > -0.28) {
                        // Procedural stylized ridges on the snow boundary edge
                        let ridgeWave = sin(aspectUV.x * 28.0) * 0.012;
                        if (aspectUV.y + ridgeWave > -0.25) {
                            return snowWhite;
                        }
                    }
                    return fujiSkyBlue;
                }

                return skyColor;
            }
        `;

        // 2. Main WebGPU Hardware Setup Execution Loop
        async function run() {
            if (!navigator.gpu) {
                console.error("WebGPU is not supported or enabled in this browser configuration.");
                return;
            }

            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            const canvas = document.getElementById("fujiCanvas");
            const context = canvas.getContext("webgpu");
            const format = navigator.gpu.getPreferredCanvasFormat();
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            
            context.configure({ device, format, alphaMode: "opaque" });

            const module = device.createShaderModule({ code: shaderSource });
            const pipeline = device.createRenderPipeline({
                layout: "auto",
                vertex: { module, entryPoint: "vs_main" },
                fragment: { module, entryPoint: "fs_main", targets: [{ format }] }
            });

            // Create a small 8-byte buffer to transmit canvas dimensions
            const uniformBuffer = device.createBuffer({
                size: 8,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
            });

            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
            });

            const uniformData = new Float32Array(2);

            function frame() {
                uniformData[0] = canvas.width;
                uniformData[1] = canvas.height;
                device.queue.writeBuffer(uniformBuffer, 0, uniformData);

                const encoder = device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [{
                        view: context.getCurrentTexture().createView(),
                        loadOp: "clear",
                        storeOp: "store",
                        clearValue: { r: 0.15, g: 0.25, b: 0.45, a: 1.0 }
                    }]
                });

                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                pass.draw(3); // Draw the procedural full-screen shape
                pass.end();
                
                device.queue.submit([encoder.finish()]);
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);

            window.addEventListener("resize", () => {
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
            });
        }
        
        run();
    </script>
</body>
</html>
