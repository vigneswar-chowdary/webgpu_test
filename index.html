<script data-purpose="mist-simulation">
    const canvas = document.getElementById('mistCanvas');
    const ctx = canvas.getContext('2d');
    
    const birdsCanvas = document.getElementById('birdsCanvas');
    const birdsCtx = birdsCanvas.getContext('2d');
    
    let width, height;
    let particles = [];
    let birds = [];
    let globalTime = 0;
    
    // Wind and gust logic
    let frameCount = 0;
    const MIN_WIND_SPEED = 0.3;
    const SNOW_RELEASE_THRESHOLD = 0.9;
    let windIntensity = MIN_WIND_SPEED;
    let targetWind = MIN_WIND_SPEED;
    let isGusting = false;
    let gustDuration = 0;
    let nextGustTime = Math.random() * 200 + 200;
    
    function resize() {
      width = canvas.width = birdsCanvas.width = window.innerWidth;
      height = canvas.height = birdsCanvas.height = window.innerHeight;
    }
    
    window.addEventListener('resize', resize);
    resize();
    
    class MistParticle {
      constructor() {
        this.active = false;
      }
      
      reset() {
        this.active = true;
        // Spawn from the mountain's right lit slope (SVG coords: x:460-720, y:180-400 approx)
        const svgX = 460 + Math.random() * 260;
        // Interpolate rough slope height
        const baseSvgY = 180 + ((svgX - 460) / 260) * 220;
        // Add random spread mainly below the ridge to simulate blowing off the face
        const svgY = baseSvgY + Math.random() * 100; // Increased spread
        
        // Map SVG coords (0-1000 w, 0-800 h taking bottom 80% screen) to canvas coords
        this.x = width * (svgX / 1000);
        this.y = height * 0.2 + (svgY / 800) * (height * 0.8);
        
        // Make particles tiny for grainy snow-mist look
        this.size = Math.random() * 0.8 + 0.2; 
        
        // Base speed for wind vector - precisely 1/3 of average bird speed (birds are ~2.25)
        this.baseSpeed = (1.5 + Math.random() * 1.5) / 3; 
        
        this.life = 0;
        this.maxLife = Math.random() * 1.0 + 0.5; // Slightly longer life
        
        // Slight turbulence to simulate gentle snow drifting
        this.angle = Math.random() * Math.PI * 2;
        this.angleSpeed = (Math.random() - 0.5) * 0.05;

        const colors = [
          'rgba(255, 163, 132, ', 
          'rgba(255, 200, 173, ',
          'rgba(255, 255, 255, ',
          'rgba(255, 255, 255, ',
          'rgba(255, 255, 255, ' // more white for snow
        ];
        this.baseColor = colors[Math.floor(Math.random() * colors.length)];
      }
      
      update(windAngle) {
        if (!this.active) return;
        
        // Apply drifting turbulence
        this.angle += this.angleSpeed;
        const turbulentY = Math.sin(this.angle) * 0.15;
        
        // Gust intensity multiplies speed. Even during 'quiet' times, slight drift exists
        const speedMultiplier = Math.max(MIN_WIND_SPEED, windIntensity);
        
        this.vx = Math.cos(windAngle) * this.baseSpeed * speedMultiplier;
        this.vy = Math.sin(windAngle) * this.baseSpeed * speedMultiplier;
        
        this.x += this.vx;
        this.y += this.vy + turbulentY;
        
        this.life += 0.002; // Aging
        
        if (this.life >= this.maxLife || this.x > width + 10 || this.y > height) {
          this.active = false;
        }
      }
      
      draw() {
        if (!this.active) return;
        // Fade in and out
        let opacity = 0;
        if (this.life < 0.1) {
            opacity = (this.life / 0.1) * 0.8;
        } else if (this.life > this.maxLife - 0.2) {
            opacity = ((this.maxLife - this.life) / 0.2) * 0.8;
        } else {
            opacity = 0.8; // Higher peak opacity for sharper grain
        }
        
        if (opacity < 0) opacity = 0;
        
        ctx.fillStyle = this.baseColor + opacity + ')';
        // Fill rect is faster and looks sharper/grainier than arc
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    class OrigamiBird {
      constructor(x, y, vx, vy, scale) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.scale = scale;
        this.flapAngle = Math.random() * Math.PI * 2;
        this.flapSpeed = 0.08 + Math.random() * 0.06;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.flapAngle += this.flapSpeed;
      }

      draw() {
        birdsCtx.save();
        birdsCtx.translate(this.x, this.y);
        birdsCtx.scale(this.scale, this.scale);
        
        // Tilt bird slightly based on velocity
        birdsCtx.rotate(Math.atan2(this.vy, this.vx) * 0.5);

        const flap = Math.sin(this.flapAngle);

        // Minimalist origami shape (two triangles)
        
        // Back/Left Wing
        birdsCtx.fillStyle = 'rgba(255, 230, 220, 0.7)';
        birdsCtx.beginPath();
        birdsCtx.moveTo(0, 0); // body center
        birdsCtx.lineTo(-8, -6 + flap * 5); // wing tip
        birdsCtx.lineTo(-3, 1); // body rear
        birdsCtx.fill();

        // Front/Right Wing (slightly brighter, catching light)
        birdsCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        birdsCtx.beginPath();
        birdsCtx.moveTo(0, 0);
        birdsCtx.lineTo(2, -4 + flap * 4); // wing tip
        birdsCtx.lineTo(-3, 1); // body rear
        birdsCtx.fill();

        birdsCtx.restore();
      }
    }
    
    // Increased particle count for higher density (7500)
    for (let i = 0; i < 7500; i++) {
      particles.push(new MistParticle());
    }

    function manageFlocks() {
      // Occasional spawn (keep it rare and peaceful)
      if (Math.random() < 0.003 && birds.length < 15) {
        const flockSize = Math.floor(Math.random() * 4) + 3; // 3 to 6 birds
        const startY = height * 0.15 + Math.random() * height * 0.25; // Sky region
        const baseVx = 1.5 + Math.random() * 1.5;
        const baseVy = (Math.random() - 0.5) * 0.4;
        // Scaled up birds to be more prominent
        const baseScale = 0.5 + Math.random() * 0.3; 

        for (let i = 0; i < flockSize; i++) {
          birds.push(new OrigamiBird(
            -50 - Math.random() * 80, // Stagger start X
            startY + (Math.random() - 0.5) * 40, // Stagger Y slightly
            baseVx + (Math.random() - 0.5) * 0.3, // Slight variation in speed
            baseVy + (Math.random() - 0.5) * 0.2,
            baseScale * (0.8 + Math.random() * 0.4) // Slight variation in size
          ));
        }
      }

      // Cleanup off-screen birds
      birds = birds.filter(b => b.x < width + 50);
    }
    
    function animate() {
      ctx.clearRect(0, 0, width, height);
      birdsCtx.clearRect(0, 0, width, height);
      
      globalTime += 0.01;
      frameCount++;
      
      // Wind Cycle Logic: Active (Gusting) vs Quiet Times
      if (frameCount >= nextGustTime) {
          isGusting = true;
          gustDuration = Math.random() * 250 + 150; // frames
          targetWind = SNOW_RELEASE_THRESHOLD + Math.random() * 1.2;
          nextGustTime = frameCount + gustDuration + Math.random() * 400 + 300;
      }
      
      if (isGusting) {
          gustDuration--;
          targetWind += (Math.random() - 0.5) * 0.05; // slight variation during gust
          if (gustDuration <= 0) {
              isGusting = false;
              targetWind = MIN_WIND_SPEED + Math.random() * 0.2;
          }
      } else {
          // Natural rhythmic quiet periods
          targetWind = MIN_WIND_SPEED + Math.sin(frameCount * 0.01) * 0.1;
      }
      
      // Smoothly interpolate wind intensity
      windIntensity += (targetWind - windIntensity) * 0.015;
      
      // Fixed downward gradient between 10 and 18 degrees
      // 14 is the center, +/- 4 degrees of smooth variation
      const windAngleDegrees = 14 + Math.sin(globalTime * 0.5) * 4;
      const windAngle = windAngleDegrees * (Math.PI / 180);
      
      // Amount of mist released scales above threshold
      let particlesToSpawn = 0;
      if (windIntensity > SNOW_RELEASE_THRESHOLD) {
         particlesToSpawn = Math.floor((windIntensity - SNOW_RELEASE_THRESHOLD) * 60); 
      }
      
      particles.forEach(p => {
        if (!p.active && particlesToSpawn > 0) {
            p.reset();
            particlesToSpawn--;
        }
        p.update(windAngle);
        p.draw();
      });

      manageFlocks();
      
      birds.forEach(b => {
        b.update();
        b.draw();
      });
      
      requestAnimationFrame(animate);
    }
