<script data-purpose="mist-simulation">
  (function() {
    const canvas = document.getElementById('mistCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    
    const birdsCanvas = document.getElementById('birdsCanvas');
    const birdsCtx = birdsCanvas.getContext('2d', { alpha: true });
    
    let width, height;
    let particles = [];
    let birds = [];
    let globalTime = 0;
    
    // Wind and gust logic
    let frameCount = 0;
    const MIN_WIND_SPEED = 0.3;
    const SNOW_RELEASE_THRESHOLD = 0.9;
    let windIntensity = MIN_WIND_SPEED;
    let targetWind = MIN_WIND_SPEED;
    let isGusting = false;
    let gustDuration = 0;
    let nextGustTime = Math.random() * 200 + 200;
    
    // Updated Projection Logic: Widen to 1200 and ensure full width containment
    let svgScaleX, svgScaleY, svgOffsetX, svgOffsetY;

    function resize() {
      width = canvas.width = birdsCanvas.width = window.innerWidth;
      height = canvas.height = birdsCanvas.height = window.innerHeight;
      
      const SVG_WIDTH = 1200;
      const SVG_HEIGHT = 800;
      const svgAspect = SVG_WIDTH / SVG_HEIGHT;
      
      // Robust matrix: Scale to fit width primarily, ensuring mountain base is always fully visible
      svgScaleX = width / SVG_WIDTH;
      svgScaleY = svgScaleX; 
      
      svgOffsetX = 0;
      // Anchor to bottom
      svgOffsetY = height - (SVG_HEIGHT * svgScaleY);
    }
    
    window.addEventListener('resize', resize);
    resize();
    
    class MistParticle {
      constructor() {
        this.active = false;
      }
      
      reset() {
        this.active = true;
        // Adjusted spawn range for widened mountain
        const svgX = 500 + Math.random() * 400;
        const baseSvgY = 180 + ((svgX - 600) / 400) * 250;
        const svgY = baseSvgY + Math.random() * 120;
        
        this.x = svgOffsetX + (svgX * svgScaleX);
        this.y = svgOffsetY + (svgY * svgScaleY);
        this.size = Math.random() * 0.8 + 0.2; 
        this.baseSpeed = (1.5 + Math.random() * 1.5) / 3; 
        this.life = 0;
        this.maxLife = Math.random() * 1.0 + 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.angleSpeed = (Math.random() - 0.5) * 0.05;

        const colors = [
          'rgba(255, 163, 132, ', 
          'rgba(255, 200, 173, ',
          'rgba(255, 255, 255, ',
          'rgba(255, 255, 255, ',
          'rgba(255, 255, 255, '
        ];
        this.baseColor = colors[Math.floor(Math.random() * colors.length)];
      }
      
      update(windAngle) {
        if (!this.active) return;
        
        this.angle += this.angleSpeed;
        const turbulentY = Math.sin(this.angle) * 0.15;
        const speedMultiplier = Math.max(MIN_WIND_SPEED, windIntensity);
        
        const vx = Math.cos(windAngle) * this.baseSpeed * speedMultiplier;
        const vy = Math.sin(windAngle) * this.baseSpeed * speedMultiplier;
        
        this.x += vx;
        this.y += vy + turbulentY;
        
        this.life += 0.002;
        
        if (this.life >= this.maxLife || this.x > width + 20 || this.y > height + 20) {
          this.active = false;
        }
      }
      
      draw() {
        if (!this.active) return;
        let opacity = 0.8;
        if (this.life < 0.1) opacity = (this.life / 0.1) * 0.8;
        else if (this.life > this.maxLife - 0.2) opacity = ((this.maxLife - this.life) / 0.2) * 0.8;
        
        if (opacity < 0) opacity = 0;
        
        ctx.fillStyle = this.baseColor + opacity + ')';
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    class OrigamiBird {
      constructor(x, y, vx, vy, scale) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.scale = scale;
        this.flapAngle = Math.random() * Math.PI * 2;
        this.flapSpeed = 0.08 + Math.random() * 0.08;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.flapAngle += this.flapSpeed;
      }

      draw() {
        birdsCtx.save();
        birdsCtx.translate(this.x, this.y);
        birdsCtx.scale(this.scale, this.scale);
        birdsCtx.rotate(Math.atan2(this.vy, this.vx) * 0.5);

        const flap = Math.sin(this.flapAngle);
        birdsCtx.fillStyle = 'rgba(255, 230, 220, 0.7)';
        birdsCtx.beginPath();
        birdsCtx.moveTo(0, 0); 
        birdsCtx.lineTo(-8, -6 + flap * 5); 
        birdsCtx.lineTo(-3, 1); 
        birdsCtx.fill();

        birdsCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        birdsCtx.beginPath();
        birdsCtx.moveTo(0, 0);
        birdsCtx.lineTo(2, -4 + flap * 4); 
        birdsCtx.lineTo(-3, 1);
        birdsCtx.fill();

        birdsCtx.restore();
      }
    }
    
    const MAX_PARTICLES = 3500;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      particles.push(new MistParticle());
    }

    function manageFlocks() {
      if (Math.random() < 0.003 && birds.length < 10) {
        const flockSize = Math.floor(Math.random() * 3) + 2;
        const startY = height * 0.15 + Math.random() * height * 0.25;
        const baseVx = 0.8 + Math.random() * 1.2;
        const baseVy = (Math.random() - 0.5) * 0.1;
        const baseScale = 0.5 + Math.random() * 0.3; 

        for (let i = 0; i < flockSize; i++) {
          birds.push(new OrigamiBird(
            -50 - Math.random() * 80,
            startY + (Math.random() - 0.5) * 40,
            baseVx + (Math.random() - 0.5) * 0.1,
            baseVy + (Math.random() - 0.5) * 0.05,
            baseScale * (0.8 + Math.random() * 0.4)
          ));
        }
      }
      birds = birds.filter(b => b.x < width + 100);
    }
    
    function animate() {
      ctx.clearRect(0, 0, width, height);
      birdsCtx.clearRect(0, 0, width, height);
      
      globalTime += 0.01;
      frameCount++;
      
      if (frameCount >= nextGustTime) {
          isGusting = true;
          gustDuration = Math.random() * 250 + 150;
          targetWind = SNOW_RELEASE_THRESHOLD + Math.random() * 1.2;
          nextGustTime = frameCount + gustDuration + Math.random() * 400 + 300;
      }
      
      if (isGusting) {
          gustDuration--;
          if (gustDuration <= 0) {
              isGusting = false;
              targetWind = MIN_WIND_SPEED + Math.random() * 0.2;
          }
      } else {
          targetWind = MIN_WIND_SPEED + Math.sin(frameCount * 0.01) * 0.1;
      }
      
      windIntensity += (targetWind - windIntensity) * 0.015;
      const windAngleDegrees = 14 + Math.sin(globalTime * 0.5) * 4;
      const windAngle = windAngleDegrees * (Math.PI / 180);
      
      let particlesToSpawn = 0;
      if (windIntensity > SNOW_RELEASE_THRESHOLD) {
         particlesToSpawn = Math.floor((windIntensity - SNOW_RELEASE_THRESHOLD) * 40); 
      }
      
      for(let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!p.active && particlesToSpawn > 0) {
            p.reset();
            particlesToSpawn--;
        }
        if (p.active) {
            p.update(windAngle);
            p.draw();
        }
      }

      manageFlocks();
      for(let i = 0; i < birds.length; i++) {
        birds[i].update();
        birds[i].draw();
      }
      
      requestAnimationFrame(animate);
    }
    
    animate();
  })();
</script>
